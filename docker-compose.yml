services:
  nginx:
    build:
      context: ./docker/nginx
    container_name: nginx
    volumes:
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ./laravel:/var/www/app
    ports:
      - "${URL}:80:80"
    restart: always
    networks:
      - node_net
    depends_on:
      - php-fpm
   
  php-fpm:
    build:
      context: ./docker/php-fpm
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_UID:-1000}
        GROUP_ID: ${USER_GID:-1000}
    volumes:
      - ./laravel:/var/www/app
    environment:
      - "DB_PORT=${DB_PORT}"
      - "DB_HOST=${DB_HOST}"
      - REDIS_HOST=redis
      - "REDIS_PORT=${REDIS_PORT}"
    ports:
      - "8080:8080" # reverb port
    depends_on:
      - mysql
      - redis
    networks:
      - node_net
    container_name: php-fpm

  mysql:
    platform: linux/x86_64
    image: mysql:8.0
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
    
    environment:
      - "MYSQL_ROOT_PASSWORD=${DB_PASSWORD}"
      - "MYSQL_USER=${DB_USERNAME}"
      - "MYSQL_PASSWORD=${DB_PASSWORD}"
      - "MYSQL_DATABASE=${DB_DATABASE}"
    ports:
      - "3306:3306"
    networks:
      - node_net
    container_name: mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      - PMA_HOST=mysql
      - PMA_ARBITRARY=1
    depends_on:
      - mysql
    restart: always
    ports:
      - 8082:80
    networks:
      - node_net
      
  node:
    build:
      context: ./docker/node
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_UID:-1000}
        GROUP_ID: ${USER_GID:-1000}
    ports:
      - "3000:3000"
      - "5173:5173"
    volumes:
      - ./laravel:/var/www/app
      - node_modules:/var/www/app/node_modules 
    working_dir: /var/www/app
    tty: true
    user: "${USER_UID:-1000}:${USER_GID:-1000}" 
    container_name: node
    networks:
     - node_net
    
  redis:
    image: "redis:alpine"
    #command: redis-server --requirepass sOmE_sEcUrE_pAsS --appendonly yes
    container_name: redis
    ports:
     - "6379:6379"
    volumes:
      #- .:/var/www/app
      - redis_data:/data
    networks:
     - node_net
    
    
networks:
  node_net:
    driver: bridge
    name: node_net
